<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPV - Hort Sant Patrici</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
        background: #f0f2f5;
        height: 100vh;
        overflow: hidden;
    }

    .container {
        display: grid;
        grid-template-columns: 1fr 400px;
        height: 100vh;
        gap: 10px;
        padding: 10px;
    }

    /* ====== CABECERA ====== */
    .header {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, #2e7d32, #66bb6a);
        color: white;
        padding: 15px 25px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header h1 {
        font-size: 22px;
    }

    .header .info {
        font-size: 14px;
        text-align: right;
    }

    /* ====== ZONA DE PRODUCTOS ====== */
    .productos-zona {
        background: white;
        border-radius: 10px;
        padding: 15px;
        overflow-y: auto;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .categorias {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
        flex-wrap: wrap;
    }

    .categoria-btn {
        padding: 8px 16px;
        border: 2px solid #2e7d32;
        background: white;
        color: #2e7d32;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
    }

    .categoria-btn:hover, .categoria-btn.activa {
        background: #2e7d32;
        color: white;
    }

    .productos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
    }

    .producto-card {
        background: #fafafa;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
    }

    .producto-card:hover {
        border-color: #2e7d32;
        background: #e8f5e9;
        transform: translateY(-2px);
    }

    .producto-nombre {
        font-weight: bold;
        font-size: 13px;
        color: #333;
        margin-bottom: 6px;
        min-height: 32px;
    }

    .producto-precio {
        color: #2e7d32;
        font-size: 16px;
        font-weight: bold;
    }

    .producto-iva {
        font-size: 11px;
        color: #666;
        margin-top: 4px;
    }

    /* ====== TICKET / CARRITO ====== */
    .ticket-zona {
        background: white;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        overflow: hidden;
    }

    .ticket-header {
        background: #1b5e20;
        color: white;
        padding: 15px;
        text-align: center;
        font-weight: bold;
        font-size: 16px;
    }

    .ticket-items {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
    }

    .ticket-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 8px;
        padding: 8px;
        border-bottom: 1px solid #eee;
        align-items: center;
    }

    .item-cantidad {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .btn-cantidad {
        background: #e0e0e0;
        border: none;
        width: 24px;
        height: 24px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-cantidad:hover {
        background: #bdbdbd;
    }

    .item-cantidad span {
        min-width: 24px;
        text-align: center;
        font-weight: bold;
    }

    .item-info {
        font-size: 13px;
    }

    .item-nombre {
        font-weight: bold;
        color: #333;
    }

    .item-precio {
        color: #666;
        font-size: 11px;
    }

    .item-total {
        font-weight: bold;
        color: #2e7d32;
        font-size: 14px;
    }

    .btn-eliminar {
        background: #ef5350;
        color: white;
        border: none;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        cursor: pointer;
        margin-left: 4px;
    }

    .ticket-vacio {
        text-align: center;
        color: #999;
        padding: 40px 20px;
        font-style: italic;
    }

    /* ====== TOTALES ====== */
    .ticket-totales {
        background: #f5f5f5;
        padding: 12px 15px;
        border-top: 2px solid #ddd;
    }

    .totales-fila {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 2px 0;
        color: #555;
    }

    .total-final {
        display: flex;
        justify-content: space-between;
        font-size: 22px;
        font-weight: bold;
        color: #2e7d32;
        padding: 8px 0 4px 0;
        border-top: 2px dashed #999;
        margin-top: 6px;
    }

    /* ====== BOTONES ACCIONES ====== */
    .acciones {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px;
        background: #fafafa;
    }

    .btn-accion {
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: all 0.2s;
    }

    .btn-cancelar {
        background: #ef5350;
        color: white;
    }

    .btn-cancelar:hover { background: #d32f2f; }

    .btn-cobrar {
        background: #2e7d32;
        color: white;
        font-size: 16px;
    }

    .btn-cobrar:hover { background: #1b5e20; }

    .btn-cobrar:disabled {
        background: #bdbdbd;
        cursor: not-allowed;
    }

    /* ====== MODAL COBRO ====== */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal-overlay.activo { display: flex; }

    .modal {
        background: white;
        border-radius: 12px;
        padding: 25px;
        width: 400px;
        max-width: 90%;
    }

    .modal h2 {
        color: #2e7d32;
        margin-bottom: 15px;
        text-align: center;
    }

    .modal-total {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        color: #2e7d32;
        padding: 15px;
        background: #e8f5e9;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .pago-opciones {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
    }

    .pago-btn {
        padding: 20px;
        border: 2px solid #ddd;
        background: white;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: all 0.2s;
    }

    .pago-btn:hover, .pago-btn.activo {
        border-color: #2e7d32;
        background: #e8f5e9;
        color: #2e7d32;
    }

    .modal-acciones {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    /* ====== SCROLL ====== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
</style>
</head>
<body>

<div class="container">

    <!-- CABECERA -->
    <div class="header">
        <h1>🌿 Hort Sant Patrici - TPV</h1>
        <div class="info">
            <div id="fecha-hora">--/--/---- --:--</div>
            <div>Cajero: <strong id="cajero-actual">Admin</strong></div>
        </div>
    </div>

    <!-- ZONA PRODUCTOS -->
    <div class="productos-zona">
        <div class="categorias" id="categorias-lista"></div>
        <div class="productos-grid" id="productos-lista"></div>
    </div>

    <!-- ZONA TICKET -->
    <div class="ticket-zona">
        <div class="ticket-header">
            🧾 TICKET ACTUAL
        </div>

        <div class="ticket-items" id="ticket-items">
            <div class="ticket-vacio">
                Añade productos al ticket pulsando sobre ellos
            </div>
        </div>

        <div class="ticket-totales">
            <div class="totales-fila">
                <span>Base IVA 4%:</span>
                <span id="base-4">0,00 €</span>
            </div>
            <div class="totales-fila">
                <span>Base IVA 10%:</span>
                <span id="base-10">0,00 €</span>
            </div>
            <div class="totales-fila">
                <span>Base IVA 21%:</span>
                <span id="base-21">0,00 €</span>
            </div>
            <div class="totales-fila">
                <span>Total IVA:</span>
                <span id="total-iva">0,00 €</span>
            </div>
            <div class="total-final">
                <span>TOTAL:</span>
                <span id="total-final">0,00 €</span>
            </div>
        </div>

        <div class="acciones">
            <button class="btn-accion btn-cancelar" onclick="cancelarTicket()">
                ❌ Cancelar
            </button>
            <button class="btn-accion btn-cobrar" id="btn-cobrar" onclick="abrirCobro()" disabled>
                💰 Cobrar
            </button>
        </div>
    </div>

</div>

<!-- MODAL DE COBRO -->
<div class="modal-overlay" id="modal-cobro">
    <div class="modal">
        <h2>💳 Forma de pago</h2>
        <div class="modal-total" id="modal-total">0,00 €</div>
        
        <div class="pago-opciones">
            <button class="pago-btn" data-pago="EFECTIVO" onclick="seleccionarPago('EFECTIVO')">
                💵 Efectivo
            </button>
            <button class="pago-btn" data-pago="TARJETA" onclick="seleccionarPago('TARJETA')">
                💳 Tarjeta
            </button>
            <button class="pago-btn" data-pago="BIZUM" onclick="seleccionarPago('BIZUM')">
                📱 Bizum
            </button>
            <button class="pago-btn" data-pago="TRANSFERENCIA" onclick="seleccionarPago('TRANSFERENCIA')">
                🏦 Transferencia
            </button>
        </div>

        <div class="modal-acciones">
            <button class="btn-accion btn-cancelar" onclick="cerrarModal()">
                Cancelar
            </button>
            <button class="btn-accion btn-cobrar" id="btn-confirmar-cobro" onclick="confirmarCobro()" disabled>
                ✅ Confirmar e Imprimir
            </button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
